<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Doudou Nation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ground: #080C0B;
    --ink: #F3EBDD;
    --ink-dim: #B7B1A4;
    --sun: #F6C84C;
    --hibiscus: #F0447B;
    --lagoon: #35C6A1;
    --line: rgba(243, 235, 221, 0.16);
    --card-bg: #0E1412;

    --font-display: 'Anton', Impact, sans-serif;
    --font-body: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    --font-accent: Georgia, 'Iowan Old Style', 'Times New Roman', serif;
    --font-mono: 'Space Mono', ui-monospace, 'SF Mono', monospace;

    --space: clamp(3rem, 9vw, 6rem);
    --radius: 16px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--font-body);
    overflow-x: hidden;
  }

  body { position: relative; }

  a { color: inherit; }

  button { font: inherit; }

  button:focus-visible,
  a:focus-visible {
    outline: 3px solid var(--lagoon);
    outline-offset: 3px;
  }

  .grain-overlay {
    position: fixed;
    inset: 0;
    background-image: url('assets/03_grain_stars_transparent.png');
    background-size: 480px;
    pointer-events: none;
    z-index: 60;
    opacity: 0.5;
    mix-blend-mode: overlay;
  }

  /* ---------- nav ---------- */

  .nav {
    position: sticky;
    top: 0;
    z-index: 40;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    padding: 0.9rem 1.25rem;
    background: var(--ground);
    border-bottom: 1px solid var(--line);
  }

  .nav__left { display: flex; align-items: center; gap: 0.9rem; }

  .nav__burger {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 4px;
    width: 30px;
    height: 30px;
    background: none;
    border: none;
    cursor: pointer;
    padding: 0;
  }

  .nav__burger span {
    display: block;
    height: 2px;
    background: var(--ink);
    border-radius: 2px;
  }

  .nav__logo {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: var(--sun);
    color: var(--ground);
    font-family: var(--font-display);
    font-size: 0.75rem;
    display: flex;
    align-items: center;
    justify-content: center;
    letter-spacing: 0.02em;
  }

  .nav__ticket {
    font-family: var(--font-mono);
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--ground);
    background: var(--hibiscus);
    border: none;
    border-radius: 999px;
    padding: 0.55em 1.1em;
    cursor: pointer;
  }

  .nav__menu {
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    background: var(--ground);
    border-bottom: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    padding: 0.5rem 1.25rem 1rem;
  }

  .nav__menu[hidden] { display: none; }

  .nav__menu a {
    padding: 0.7em 0;
    font-family: var(--font-mono);
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--ink-dim);
    text-decoration: none;
    border-top: 1px solid var(--line);
  }

  .nav__menu a:first-child { border-top: none; }

  /* ---------- marquee ---------- */

  .marquee {
    background: var(--hibiscus);
    color: var(--ground);
    overflow: hidden;
    position: relative;
    z-index: 10;
  }

  .marquee__track {
    display: flex;
    width: max-content;
    animation: scrollLeft 26s linear infinite;
  }

  .marquee__group { display: flex; align-items: center; flex-shrink: 0; }

  .marquee__track span {
    display: inline-block;
    padding: 0.55rem 1.5rem;
    font: 700 clamp(0.75rem, 1.7vw, 0.95rem) / 1 var(--font-mono);
    letter-spacing: 0.04em;
    text-transform: uppercase;
    white-space: nowrap;
  }

  @keyframes scrollLeft {
    from { transform: translateX(0); }
    to { transform: translateX(-50%); }
  }

  /* ---------- hero ---------- */

  .hero {
    position: relative;
    padding: var(--space) 1.25rem calc(var(--space) * 0.7);
    text-align: center;
    overflow: hidden;
    background-image: url('assets/01_background_tropical_sunset.png');
    background-size: cover;
    background-position: center bottom;
  }

  .hero::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(8,12,11,0.35) 0%, rgba(8,12,11,0.55) 55%, var(--ground) 100%);
  }

  .hero__beams {
    position: absolute;
    top: -15%;
    left: 50%;
    width: 140vw;
    max-width: 1100px;
    transform: translateX(-50%);
    opacity: 0.8;
    animation: spin 90s linear infinite;
    pointer-events: none;
  }

  @keyframes spin { to { transform: translateX(-50%) rotate(360deg); } }

  .hero__inner { position: relative; max-width: 30rem; margin: 0 auto; }

  .eyebrow {
    font-family: var(--font-accent);
    font-style: italic;
    font-size: clamp(0.9rem, 2vw, 1.05rem);
    color: var(--ink-dim);
    margin: 0 0 0.75em;
  }

  .hero__title {
    margin: 0;
    font-family: var(--font-display);
    font-weight: 400;
    text-transform: uppercase;
    font-size: clamp(3rem, 15vw, 6.5rem);
    line-height: 0.9;
    letter-spacing: 0.005em;
    color: var(--sun);
    text-wrap: balance;
  }

  .hero__badgeline {
    margin: 0.6em 0 1.4em;
    font-family: var(--font-mono);
    font-size: 0.75rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--hibiscus);
  }

  .hero__scroll_credit {
    font-family: var(--font-mono);
    font-size: 0.72rem;
    letter-spacing: 0.08em;
    color: var(--ink-dim);
    text-transform: uppercase;
    margin: 0 0 1.6em;
  }

  .hero__tagline {
    font-family: var(--font-accent);
    font-style: italic;
    font-size: clamp(1.05rem, 2.6vw, 1.3rem);
    color: var(--ink);
    max-width: 26ch;
    margin: 0 auto 0.6em;
    text-wrap: balance;
  }

  .hero__tagline--small {
    font-size: clamp(0.9rem, 2.2vw, 1.05rem);
    color: var(--ink-dim);
    margin-bottom: 1.8em;
  }

  .meta-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 0.7rem;
    margin: 0 0 1.8em;
  }

  .meta-card {
    background: var(--card-bg);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 0.85rem 0.75rem;
    text-align: left;
  }

  .meta-card__icon { color: var(--lagoon); margin-bottom: 0.4em; }

  .meta-card dt {
    font-family: var(--font-mono);
    font-size: 0.62rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-dim);
    margin: 0 0 0.3em;
  }

  .meta-card dd {
    margin: 0;
    font-size: 0.85rem;
    font-weight: 700;
    line-height: 1.35;
  }

  .scroll-hint {
    font-family: var(--font-mono);
    font-size: 0.72rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-dim);
  }

  /* ---------- separator ---------- */

  .separator {
    display: block;
    width: 100%;
    max-width: 900px;
    margin: 0 auto;
    filter: invert(0.9) opacity(0.5);
  }

  /* ---------- sections ---------- */

  main { position: relative; z-index: 5; }

  section { padding: var(--space) 1.25rem; }

  .section__eyebrow {
    text-align: center;
    font-family: var(--font-accent);
    font-style: italic;
    color: var(--ink-dim);
    margin: 0 0 1.8em;
  }

  /* ---------- lineup ---------- */

  .lineup { max-width: 30rem; margin: 0 auto; }

  .act-card {
    border-radius: var(--radius);
    border: 1px solid var(--card-border, var(--line));
    background: var(--card-bg);
    padding: 1.1rem 1.25rem;
    text-align: center;
    margin: 0 0 0.9rem;
    box-shadow: 0 4px 0 0 var(--card-shadow, transparent);
  }

  .act-card--headliner { --card-border: var(--hibiscus); --card-shadow: rgba(240,68,123,0.25); }
  .act-card--support { --card-border: var(--sun); --card-shadow: rgba(246,200,76,0.2); }
  .act-card--guest { --card-border: var(--lagoon); --card-shadow: rgba(53,198,161,0.2); }

  .act-card__name {
    margin: 0;
    font-family: var(--font-display);
    font-weight: 400;
    text-transform: uppercase;
    letter-spacing: 0.01em;
  }

  .act-card--headliner .act-card__name { font-size: clamp(2rem, 10vw, 2.8rem); color: var(--hibiscus); }
  .act-card--support .act-card__name { font-size: clamp(1.2rem, 6vw, 1.6rem); color: var(--sun); margin-bottom: 0.5rem; }
  .act-card--support .act-card__name:last-child { margin-bottom: 0; }
  .act-card--guest .act-card__name { font-size: clamp(1.3rem, 6.5vw, 1.7rem); color: var(--lagoon); }

  .tag {
    display: inline-block;
    font-family: var(--font-mono);
    font-weight: 400;
    text-transform: lowercase;
    font-size: 0.68rem;
    letter-spacing: 0.05em;
    border: 1px solid currentColor;
    border-radius: 999px;
    padding: 0.25em 0.7em;
    margin-left: 0.4em;
    vertical-align: middle;
    opacity: 0.9;
  }

  .act-card__stage {
    margin: 0.6em 0 0;
    font-family: var(--font-mono);
    font-size: 0.68rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink-dim);
  }

  .disclosure {
    margin: 1.4rem auto 0;
    display: block;
    width: 100%;
    max-width: 30rem;
    background: none;
    border: 1px solid var(--line);
    border-radius: 999px;
    color: var(--ink);
    font-family: var(--font-mono);
    font-size: 0.75rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 0.9em 1.2em;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5em;
    cursor: pointer;
  }

  .disclosure svg { transition: transform 0.2s ease; }
  .disclosure[aria-expanded="true"] svg { transform: rotate(180deg); }

  .disclosure-panel { overflow: hidden; max-height: 0; transition: max-height 0.25s ease; }
  .disclosure-panel.is-open { max-height: 40rem; }

  .dj-list {
    list-style: none;
    margin: 1.3rem 0 0;
    padding: 0;
    text-align: center;
    font-family: var(--font-display);
    font-weight: 400;
    text-transform: uppercase;
    font-size: clamp(0.95rem, 4.5vw, 1.2rem);
  }

  .dj-list li { display: inline; }
  .dj-list li:not(:last-child)::after { content: "\00b7"; margin: 0 0.7em; color: var(--line); }

  .extra-list {
    list-style: none;
    margin: 1rem 0 0;
    padding: 0;
    text-align: center;
    font-family: var(--font-mono);
    font-size: 0.72rem;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    color: var(--ink-dim);
  }

  .extra-list li { display: inline; }
  .extra-list li:not(:last-child)::after { content: "\00b7"; margin: 0 0.6em; color: var(--line); }

  /* ---------- infos ---------- */

  .infos { max-width: 30rem; margin: 0 auto; }

  .info-block { margin: 0 0 1rem; }

  .info-block__title {
    display: flex;
    align-items: center;
    gap: 0.5em;
    font-family: var(--font-mono);
    font-size: 0.78rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin: 0 0 0.9em;
  }

  .info-block--acte .info-block__title { color: var(--lagoon); }
  .info-block--flou .info-block__title { color: var(--hibiscus); }

  .info-card {
    display: flex;
    gap: 0.75rem;
    align-items: flex-start;
    background: var(--card-bg);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 0.85rem 1rem;
    margin: 0 0 0.6rem;
  }

  .info-card__icon { flex: none; color: var(--lagoon); margin-top: 0.1em; }
  .info-block--flou .info-card__icon { color: var(--hibiscus); }

  .info-card p { margin: 0; font-size: 0.92rem; line-height: 1.45; }
  .info-card .dim { color: var(--ink-dim); }

  /* ---------- final ---------- */

  .final {
    position: relative;
    text-align: center;
    background-image: url('assets/01_background_tropical_sunset.png');
    background-size: cover;
    background-position: center bottom;
    overflow: hidden;
  }

  .final::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, var(--ground) 0%, rgba(8,12,11,0.55) 30%, rgba(8,12,11,0.55) 70%, var(--ground) 100%);
  }

  .final__inner { position: relative; max-width: 28rem; margin: 0 auto; }

  .stamp { position: relative; width: clamp(160px, 40vw, 220px); height: clamp(160px, 40vw, 220px); margin: 0 auto 2rem; }

  .stamp__ring {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    animation: spin 18s linear infinite;
  }

  .stamp__text {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    animation: spin 18s linear infinite;
    color: var(--sun);
  }

  .stamp__text text {
    font-family: var(--font-mono);
    text-transform: uppercase;
  }

  .stamp__center {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-family: var(--font-display);
    font-weight: 400;
    text-transform: uppercase;
    font-size: 1rem;
    line-height: 1.3;
    color: var(--ink);
  }

  .final__question {
    font-family: var(--font-body);
    font-weight: 700;
    font-size: clamp(1.4rem, 5vw, 2rem);
    max-width: 18ch;
    margin: 0 auto 1.6rem;
    text-wrap: balance;
  }

  .cta-btn {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: none;
    background: transparent;
    cursor: pointer;
    padding: 0;
    width: min(20rem, 86vw);
    height: clamp(3.4rem, 12vw, 4rem);
  }

  .cta-btn__bg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: fill;
  }

  .cta-btn__label {
    position: relative;
    font-family: var(--font-display);
    font-weight: 400;
    font-size: clamp(1.05rem, 4vw, 1.3rem);
    letter-spacing: 0.02em;
    text-transform: uppercase;
    color: var(--ground);
    transition: transform 0.15s ease;
  }

  .cta-btn:hover .cta-btn__label { transform: translateY(-2px); }
  .cta-btn:active .cta-btn__label { transform: translateY(1px); }
  .cta-btn:disabled { cursor: default; }

  .cta__reveal {
    margin: 1.6rem auto 0;
    max-width: 30ch;
    font-family: var(--font-accent);
    font-style: italic;
    font-size: clamp(1rem, 2.4vw, 1.15rem);
    color: var(--ink-dim);
  }

  .footer {
    position: relative;
    padding: 2.5rem 1.25rem 3rem;
    text-align: center;
    color: var(--ink-dim);
  }

  .footer p { margin: 0 0 0.6em; font-size: 0.85rem; max-width: 40ch; margin-inline: auto; }

  .footer__fine {
    font-family: var(--font-mono);
    font-size: 0.66rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    opacity: 0.75;
  }

  #confettiCanvas { position: fixed; inset: 0; pointer-events: none; z-index: 70; }

  @media (min-width: 640px) {
    .meta-grid { grid-template-columns: repeat(4, 1fr); }
  }

  @media (prefers-reduced-motion: reduce) {
    .hero__beams, .stamp__ring, .stamp__text, .marquee__track { animation: none; }
  }
</style>

<div class="grain-overlay" aria-hidden="true"></div>

<nav class="nav">
  <div class="nav__left">
    <button class="nav__burger" id="navToggle" aria-expanded="false" aria-controls="navMenu" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
    <span class="nav__logo">DN</span>
  </div>
  <button class="nav__ticket" id="navTicket" type="button">Billetterie</button>
  <div class="nav__menu" id="navMenu" hidden>
    <a href="#hero">Accueil</a>
    <a href="#lineup">Line-up</a>
    <a href="#infos">Infos pratiques</a>
    <a href="#final">C'est parti</a>
  </div>
</nav>

<div class="marquee" id="marqueeTop" aria-hidden="true">
  <div class="marquee__track"></div>
</div>

<main>
  <section class="hero" id="hero">
    <img class="hero__beams" src="assets/02_light_beams_transparent.png" alt="" aria-hidden="true">
    <div class="hero__inner">
      <p class="eyebrow" id="heroEyebrow"></p>
      <h1 class="hero__title" id="heroTitle"></h1>
      <p class="hero__badgeline" id="heroBadgeline"></p>
      <p class="hero__tagline" id="heroTagline1"></p>
      <p class="hero__tagline hero__tagline--small" id="heroTagline2"></p>

      <dl class="meta-grid" id="heroMeta"></dl>

      <p class="scroll-hint" id="heroScroll"></p>
    </div>
  </section>

  <img class="separator" src="assets/05_ticket_separator_transparent.png" alt="" aria-hidden="true">

  <section class="lineup" id="lineup">
    <p class="section__eyebrow" id="lineupEyebrow"></p>
    <div id="lineupMain"></div>
    <button class="disclosure" id="lineupToggle" type="button" aria-expanded="false" aria-controls="lineupPanel">
      <span id="lineupToggleLabel"></span>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
    </button>
    <div class="disclosure-panel" id="lineupPanel">
      <ul class="dj-list" id="djList"></ul>
      <ul class="extra-list" id="extraList"></ul>
    </div>
  </section>

  <img class="separator" src="assets/05_ticket_separator_transparent.png" alt="" aria-hidden="true">

  <section class="infos" id="infos">
    <p class="section__eyebrow" id="infosEyebrow"></p>
    <div class="info-block info-block--acte">
      <p class="info-block__title" id="acteTitle"></p>
      <div id="acteItems"></div>
    </div>
    <button class="disclosure" id="infosToggle" type="button" aria-expanded="false" aria-controls="infosPanel">
      <span id="infosToggleLabel"></span>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
    </button>
    <div class="disclosure-panel" id="infosPanel">
      <div class="info-block info-block--flou" style="margin-top:1.1rem;">
        <p class="info-block__title" id="flouTitle"></p>
        <div id="flouItems"></div>
      </div>
    </div>
  </section>

  <img class="separator" src="assets/05_ticket_separator_transparent.png" alt="" aria-hidden="true">

  <section class="final" id="final">
    <div class="final__inner">
      <div class="stamp" aria-hidden="true">
        <img class="stamp__ring" src="assets/04_badge_100_cho_wi_transparent.png" alt="">
        <svg class="stamp__text" viewBox="0 0 200 200">
          <path id="stampCirclePath" d="M100,100 m-70,0 a70,70 0 1,1 140,0 a70,70 0 1,1 -140,0" fill="none"></path>
          <text font-size="10" letter-spacing="2.2" fill="currentColor">
            <textPath href="#stampCirclePath" id="stampCircleText" startOffset="0%"></textPath>
          </text>
        </svg>
        <span class="stamp__center" id="stampCenter"></span>
      </div>

      <p class="final__question" id="finalQuestion"></p>
      <button class="cta-btn" id="hypeBtn" type="button">
        <img class="cta-btn__bg" src="assets/06_cta_button_base_transparent.png" alt="">
        <span class="cta-btn__label" id="hypeBtnLabel"></span>
      </button>
      <p id="hypeReveal" class="cta__reveal" hidden role="status"></p>
    </div>
  </section>

  <footer class="footer" id="footer">
    <p id="footerCredit"></p>
    <p class="footer__fine" id="footerSponsors"></p>
    <p class="footer__fine" id="footerSignoff"></p>
  </footer>
</main>

<div class="marquee" id="marqueeBottom" aria-hidden="true">
  <div class="marquee__track"></div>
</div>

<audio id="hypeAudio" preload="none"><source src="track.m4a" type="audio/mp4"></audio>
<canvas id="confettiCanvas"></canvas>

<script>
  var ICONS = {

  (function () {
    var btn = document.getElementById('hypeBtn');
    var label = document.getElementById('hypeBtnLabel');
    var reveal = document.getElementById('hypeReveal');
    var canvas = document.getElementById('confettiCanvas');
    var ctx = canvas.getContext('2d');
    var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.addEventListener('resize', resize);
    resize();

    var colors = ['#F6C84C', '#F0447B', '#35C6A1', '#F3EBDD'];
    var particles = [];
    var running = false;

    function burst() {
      var cx = window.innerWidth / 2;
      var cy = window.innerHeight * 0.4;
      for (var i = 0; i < 90; i++) {
        var angle = Math.random() * Math.PI * 2;
        var speed = 2 + Math.random() * 6;
        particles.push({
          x: cx, y: cy,
          vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed - 3,
          size: 4 + Math.random() * 5,
          color: colors[Math.floor(Math.random() * colors.length)],
          rot: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 0.3,
          life: 0, maxLife: 70 + Math.random() * 40
        });
      }
    }

    function tick() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      var alive = false;
      for (var i = 0; i < particles.length; i++) {
        var p = particles[i];
        if (p.life > p.maxLife) continue;
        alive = true;
        p.life++; p.vy += 0.12; p.x += p.vx; p.y += p.vy; p.rot += p.vr;
        ctx.save();
        ctx.globalAlpha = Math.max(0, 1 - p.life / p.maxLife);
        ctx.translate(p.x, p.y); ctx.rotate(p.rot);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
        ctx.restore();
      }
      particles = particles.filter(function (p) { return p.life <= p.maxLife; });
      if (alive) { requestAnimationFrame(tick); } else { running = false; }
    }

    btn.addEventListener('click', function () {
      btn.disabled = true;
      label.textContent = DATA.final.buttonClicked;
      reveal.hidden = false;
      var audio = document.getElementById('hypeAudio');
      if (audio) { audio.currentTime = 0; audio.volume = 0.45; audio.play().catch(function () {}); }
      if (!reduced) { burst(); if (!running) { running = true; tick(); } }
    });
  })();
